[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocklo"
version = "0.2.0"
description = "Command-line client for the Pocklo file workspace"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "qiniu>=7.13,<8",
  "rich>=13.9,<14",
  "requests>=2.32,<3",
]

[project.scripts]
pocklo = "pocklo_cli.cli:main"

[project.urls]
Homepage = "https://pocklo.jyonn.space/"
Documentation = "https://pocklo.jyonn.space/cli"
Source = "https://github.com/pocklo-app/pocklo-cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
