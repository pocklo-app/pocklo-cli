[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "htx-cli"
version = "0.1.4"
description = "htx-cli command-line client for the Disk backend API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "qiniu>=7.13,<8",
  "rich>=13.9,<14",
  "requests>=2.32,<3",
]

[project.scripts]
htx = "disk_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
