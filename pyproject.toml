[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-cli"
version = "0.1.0"
description = "Command-line client for the Disk backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
]

[project.scripts]
htx = "disk_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
